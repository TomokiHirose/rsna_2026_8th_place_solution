[project]
name = "rsna_knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "pylibjpeg-openjpeg>=2.5.0",
    "timm>=1.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[project.optional-dependencies]
train = [
    "albumentations>=1.4",
    "click>=8.0",
    "causal-conv1d==1.7.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flash-linear-attention>=0.5.2",
    "lightning>=2.6.1",
    "schedulefree>=1.4.1",
    "scikit-learn>=1.5",
    "torchmetrics>=1.4",
    "wandb>=0.21",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "kaggle>=1.6",
    "matplotlib>=3.9",
    "matplotlib-fontja>=1.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "rich>=13.0",
    "ruff>=0.11.12",
    "seaborn>=0.13",
    "torchinfo>=1.8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsna_knee"]

[tool.ruff]
line-length = 250
target-version = "py312"
extend-exclude = ["docs/**/*.md", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["F841", "E402", "F401"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rsna_knee", "tools"]
